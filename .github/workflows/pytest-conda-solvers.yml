name: Pytest Conda Solvers

on:
  # https://docs.github.com/en/webhooks-and-events/webhooks/webhook-events-and-payloads#push
  push:
    branches:
      - main
      - feature/**
      - '[0-9].*.x'  # e.g., 4.14.x
      - '[0-9][0-9].*.x'  # e.g., 23.3.x

  # https://docs.github.com/en/webhooks-and-events/webhooks/webhook-events-and-payloads#pull_request
  pull_request:

  # https://docs.github.com/en/webhooks-and-events/webhooks/webhook-events-and-payloads#workflow_dispatch
  workflow_dispatch:

  # no payload
  schedule:
      # https://crontab.guru/#15_7_*_*_1-5
    - cron: 15 7 * * 1-5

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # https://github.com/conda-incubator/setup-miniconda#use-a-default-shell
        shell: bash -el {0}  # bash exit immediately on error + login shell
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
        # both names register the same PycosatSolver backend; test both
        # since they're independent entry points into conda's plugin manager
        solver: [classic, pycosat]

    steps:
      - name: Checkout conda-pycosat-solver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: conda-pycosat-solver
          persist-credentials: false

      - name: Checkout pytest-conda-solvers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conda-incubator/pytest-conda-solvers
          ref: d757bfdb37c5235089c76ac4921f001713117b48
          fetch-depth: 0
          path: pytest-conda-solvers
          persist-credentials: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          channels: conda-forge
          run-post: false  # skip post cleanup

      - name: Update conda in base
        run: conda install -n base --yes --override-channels -c conda-forge "conda>=26.5" conda-pypi

      - name: Install dependencies
        run: >
          conda install
          --yes
          --override-channels -c conda-forge
          --file conda-pycosat-solver/tests/requirements.txt
          --file conda-pycosat-solver/tests/requirements-pytest-conda-solvers.txt
          python=${{ matrix.python-version }}

      - name: Editable install conda-pycosat-solver and pytest-conda-solvers
        # Run as separate commands: a single `conda pypi install -e A -e B`
        # trips a conda-pypi bug where the second editable install reuses a
        # stale (already deleted) ephemeral package cache directory.
        run: |
          conda pypi install --yes -e conda-pycosat-solver
          conda pypi install --yes -e pytest-conda-solvers

      - name: Conda Info
        run: python -m conda info --verbose

      - name: Conda List
        run: conda list --show-channel-urls

      - name: Run solver tests
        working-directory: pytest-conda-solvers
        # same invocation as pytest-conda-solvers' own CI
        run: python -m pytest --conda-solver=${{ matrix.solver }} -vv
