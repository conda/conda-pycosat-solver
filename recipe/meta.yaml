package:
  name: "conda-pycosat-solver"
  # VERSION_OVERRIDE is used by the canary release workflow
  version: {{ os.getenv("VERSION_OVERRIDE") or GIT_DESCRIBE_TAG }}.{{ GIT_DESCRIBE_NUMBER }}+{{ GIT_DESCRIBE_HASH }}

source:
  # git_url is nice in that it won't capture devenv stuff.  However, it only
  # captures committed code, so pay attention.
  git_url: ../
  folder: src/

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install src/ -vv --no-deps --no-build-isolation"

requirements:
  host:
    - python >=3.11
    - pip
    - hatchling
    - hatch-vcs
  run:
    - boltons >=23.0.0
    - conda >=23.7.3
    - frozendict >=2.4.2
    - packaging >=26.3
    - pycosat >=0.6.3
    - python >=3.11
    - tqdm >=4

test:
  imports:
    - conda_pycosat_solver
  commands:
    - conda create -n test --dry-run scipy --solver=pycosat
    - conda create -n test --dry-run scipy --solver=classic
    - >-
      python -c
      "import conda_pycosat_solver as pycosat;
      from importlib.metadata import version;
      assert '{{ PKG_VERSION }}' == pycosat.__version__ == version('conda_pycosat_solver'),
      '{{ PKG_VERSION }}' + f', {pycosat.__version__}, ' + version('conda_pycosat_solver')
      " || true
    # we accept errors here because GIT_DESCRIBE_TAG has some accuracy issues.
    # Shouldn't happen in production recipes; aka do not add '|| true' in the feedstock

about:
  home: https://github.com/conda/conda-pycosat-solver
  license: BSD-3-Clause
  license_family: BSD
  license_file: src/LICENSE
  summary: 'The `pycosat` solver used in `conda`, also available as `classic`.'

extra:
  recipe-maintainers:
    - jaimergp
    - jezdez
